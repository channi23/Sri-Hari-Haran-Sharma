<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Resume of Sri Hari Haran Sharma, AI systems engineer and open-source contributor." />
		<meta name="theme-color" content="#0d0d0d" />
		<title>Resume | Sri Hari Haran Sharma</title>
		<style>
			:root { --paper: #0d0d0d; --ink: #f3f3ef; --muted: #a7a7a0; --line: #363633; }
			* { box-sizing: border-box; }
			html { color-scheme: dark; }
			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font-family: Arial, Helvetica, sans-serif;
			}
			a { color: inherit; }
			.skip-link {
				position: fixed;
				top: 10px;
				left: 10px;
				z-index: 20;
				padding: 8px 12px;
				background: var(--ink);
				color: var(--paper);
				transform: translateY(-160%);
			}
			.skip-link:focus { transform: translateY(0); }
			.site-header,
			main,
			footer { width: min(calc(100% - 48px), 1240px); margin-inline: auto; }
			.site-header {
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: center;
				min-height: 76px;
				border-bottom: 1px solid var(--ink);
			}
			.wordmark { width: fit-content; font-weight: 800; letter-spacing: -0.05em; text-decoration: none; }
			.header-actions { display: flex; align-items: center; gap: 22px; }
			.header-actions a {
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				text-underline-offset: 5px;
			}
			main { padding: 58px 0 72px; }
			.resume-heading {
				display: grid;
				grid-template-columns: 1fr 2fr;
				gap: 36px;
				align-items: end;
				margin-bottom: 42px;
			}
			.eyebrow { margin: 0; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
			h1 { margin: 0; font-size: clamp(54px, 9vw, 124px); line-height: 0.86; letter-spacing: -0.07em; }
			.resume-heading div { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
			.resume-heading p { max-width: 410px; margin: 0; color: var(--muted); line-height: 1.6; }
			.download {
				flex: 0 0 auto;
				padding-bottom: 4px;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				text-underline-offset: 5px;
			}
			.resume-shell {
				position: relative;
				isolation: isolate;
				padding: clamp(10px, 2vw, 22px);
				border: 1px solid var(--line);
				background: rgba(255, 255, 255, 0.035);
				box-shadow: 0 26px 100px rgba(255, 255, 255, 0.09), 0 16px 50px rgba(0, 0, 0, 0.45);
			}
			.resume-shell::before {
				content: "";
				position: absolute;
				z-index: -1;
				inset: -6% 8% 16%;
				background: radial-gradient(ellipse at 50% 22%, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.055) 34%, transparent 68%);
				filter: blur(34px);
				pointer-events: none;
			}
			.resume-frame {
				display: block;
				width: 100%;
				height: min(82vh, 980px);
				min-height: 680px;
				border: 0;
				background: #fff;
			}
			.viewer-fallback { padding: 28px; background: #fff; color: #111; line-height: 1.6; }
			.viewer-fallback a { font-weight: 700; }
			footer {
				display: flex;
				justify-content: space-between;
				padding: 24px 0 42px;
				border-top: 1px solid var(--ink);
				font-size: 12px;
			}
			@media (max-width: 760px) {
				.site-header, main, footer { width: min(calc(100% - 28px), 1240px); }
				.header-actions a:first-child { display: none; }
				main { padding-top: 38px; }
				.resume-heading { grid-template-columns: 1fr; gap: 24px; }
				.resume-heading div { align-items: flex-start; flex-direction: column; }
				.resume-frame { min-height: 620px; height: 78vh; }
			}
		</style>
	</head>
	<body>
		<a class="skip-link" href="#resume-viewer">Skip to resume</a>
		<header class="site-header">
			<a class="wordmark" href="../">SHS</a>
			<div class="header-actions">
				<a href="../">Back to portfolio</a>
				<a href="../assets/sri-hari-haran-sharma-resume.pdf" download>Download PDF</a>
			</div>
		</header>
		<main>
			<section class="resume-heading" aria-labelledby="resume-title">
				<div>
					<p class="eyebrow">The one-page version</p>
					<h1 id="resume-title">Resume</h1>
				</div>
				<div>
					<p>AI systems, backend engineering, applied machine learning, and open-source work around JSON Schema.</p>
					<a class="download" href="../assets/sri-hari-haran-sharma-resume.pdf" download>Download PDF</a>
				</div>
			</section>
			<section class="resume-shell" id="resume-viewer" aria-label="Resume PDF viewer">
				<object class="resume-frame" data="../assets/sri-hari-haran-sharma-resume.pdf#view=FitH&amp;toolbar=1" type="application/pdf">
					<div class="viewer-fallback">Your browser cannot display the embedded PDF. <a href="../assets/sri-hari-haran-sharma-resume.pdf">Open the resume directly</a>.</div>
				</object>
			</section>
		</main>
		<footer><span>Sri Hari Haran Sharma</span><a href="../">Portfolio</a></footer>
	</body>
</html>
