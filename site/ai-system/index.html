hnical self-test", "Next week’s primary objective"], "gate": true}], "weeks": [{"n": 1, "title": "Establish a reproducible learning and data baseline", "why": "A runnable baseline makes later changes measurable. It also distinguishes tools you have encountered from mechanisms you can explain.", "res": "arrow"}, {"n": 2, "title": "Rebuild linear algebra through executable geometry", "why": "Array operations become safer when dimensions carry meaning. These experiments prepare you for least squares, attention, and vector retrieval.", "res": "mml2"}, {"n": 3, "title": "Understand records, pages, and physical layout", "why": "You will build a small storage laboratory to explain DBMS internals. Keep this laboratory separate from the Parquet lakehouse: Parquet already owns its physical layout.", "res": "db"}, {"n": 4, "title": "Derive gradients before optimizing models", "why": "Differentiation gives you a way to predict how parameters affect loss. Small numerical checks make later backpropagation bugs easier to isolate.", "res": "mml5"}, {"n": 5, "title": "Build and measure a small buffer and index laboratory", "why": "Indexes and buffers trade memory, I/O, and update work. Implementing simplified versions lets you reason about real query plans without building a production DBMS.", "res": "db"}, {"n": 6, "title": "Make probability and estimation concrete", "why": "Model outputs and benchmark results both carry uncertainty. Simulations connect probability rules to measurements you can inspect.", "res": "mml6"}, {"n": 7, "title": "Build and evaluate classical ML from mechanisms", "why": "The goal is to explain training, not just call an estimator. Every comparison uses a held-out set and a reproducible data split.", "res": "mml8"}, {"n": 8, "title": "Prove the first phase with reproducible evidence", "why": "This week converts exercises into capabilities you can demonstrate. Weak areas are repaired before the curriculum adds deeper systems and neural networks.", "res": "sklearn"}, {"n": 9, "title": "Understand transactions before adding commit machinery", "why": "Atomicity, isolation, and durability solve different problems. Small schedules make those distinctions visible before you encode lakehouse behavior.", "res": "postgres"}, {"n": 10, "title": "Give the lakehouse immutable snapshots", "why": "A snapshot must identify one complete dataset state. The commit pointer becomes a small but critical piece of mutable state.", "res": "arrow"}, {"n": 11, "title": "Evolve layouts and schemas without breaking readers", "why": "Optimization should preserve the logical dataset. Each change needs compatibility rules and evidence that old snapshots remain meaningful.", "res": "arrow"}, {"n": 12, "title": "Test storage failures and close the reliability phase", "why": "Happy-path ingestion does not establish correctness. This week builds a repeatable failure matrix around the guarantees your local design actually offers.", "res": "os"}, {"n": 13, "title": "Implement neural network learning in NumPy", "why": "Your calculus exercises now become a learning system. Build the forward and backward paths in small pieces so every gradient has an explanation.", "res": "mml5"}, {"n": 14, "title": "Move the same model into PyTorch", "why": "A framework should preserve your understanding while enabling better experiments. Equivalence checks keep convenience from hiding errors.", "res": "torch"}, {"n": 15, "title": "Understand local and sequential neural computation", "why": "CNNs and recurrent models introduce parameter sharing and sequence state. The purpose is architectural reasoning, not a separate computer-vision specialization.", "res": "torch"}, {"n": 16, "title": "Build attention from its equations", "why": "Attention connects linear algebra to sequence modeling. Shape checks, masks, and controlled examples make the mechanism inspectable.", "res": "attention"}, {"n": 17, "title": "Train a tiny language model end to end", "why": "A small local model makes the entire pipeline visible. The target is an understandable experiment, not competitive language quality.", "res": "torch"}, {"n": 18, "title": "Measure inference and implement a KV cache", "why": "Inference has different bottlenecks from training. Separate prompt processing, token generation, memory use, and queueing in your measurements.", "res": "paged"}, {"n": 19, "title": "Serve a bounded model through a clear API", "why": "Serving adds validation, resource ownership, and failure handling around a model. Keep the contract small and observable before adding orchestration.", "res": "fast"}, {"n": 20, "title": "Build retrieval from exact search to indexed search", "why": "Retrieval is a measurable ranking problem. An exact baseline lets you evaluate approximate search rather than trust an index configuration blindly.", "res": "faiss"}, {"n": 21, "title": "Build a transparent retrieval-augmented answer service", "why": "The retriever, prompt, and generator should remain independently testable. Evidence attribution is part of the output contract, not a cosmetic addition.", "res": "fast"}, {"n": 22, "title": "Evaluate AI behavior with reproducible evidence", "why": "A fluent answer is not evidence of correctness. Separate retrieval quality, answer support, and service reliability so improvements have an interpretable cause.", "res": "sklearn"}, {"n": 23, "title": "Understand concurrency and resource limits", "why": "Asynchronous I/O, threads, and processes solve different problems. Experiments on your own service make the distinction concrete.", "res": "async"}, {"n": 24, "title": "Make background jobs safe under retries", "why": "Queues introduce duplicate delivery and delayed work. Idempotency and bounded retry behavior keep these expected failures from corrupting results.", "res": "design"}, {"n": 25, "title": "Reason about distributed failure with simulations", "why": "Network delay and process failure are different from local function errors. Controlled schedules expose the assumptions that fail when state is replicated.", "res": "design"}, {"n": 26, "title": "Learn consensus and distributed transaction limits", "why": "Consensus coordinates a replicated decision under explicit assumptions. The exercises are educational simulations, not a production consensus library.", "res": "raft"}, {"n": 27, "title": "Deploy using cloud primitives and explicit limits", "why": "Cloud APIs do not erase distributed-systems constraints. Start with identity, storage semantics, and a small service deployment design.", "res": "cloud"}, {"n": 28, "title": "Port snapshot publication to object storage safely", "why": "Cloud-backed snapshots need immutable data and a conditional metadata update. A mock can test protocol logic, but provider integration evidence must remain distinct.", "res": "cloud"}, {"n": 29, "title": "Optimize using measurements and controlled workloads", "why": "Performance work begins with a bottleneck and a baseline. Improvements must preserve correctness and state hardware and workload conditions.", "res": "paged"}, {"n": 30, "title": "Explore quantization and inference tradeoffs", "why": "Reduced precision can change memory use, latency, and output quality differently. Keep numerical experiments small and make no hardware-independent speed promises.", "res": "torch"}, {"n": 31, "title": "Operate the service with explicit objectives", "why": "A system needs observable failure signals and a recovery path. This week turns your prototype into something another engineer can run and diagnose.", "res": "design"}, {"n": 32, "title": "Add constrained tool use and close the infrastructure phase", "why": "Tool execution introduces authority and side effects beyond text generation. Use a small, explicit state machine with schema validation and human approval for consequential actions.", "res": "schema"}, {"n": 33, "title": "Make training a reproducible data pipeline", "why": "Training should consume an identified dataset and produce an identified model. This connects lakehouse semantics to reliable AI experimentation.", "res": "torch"}, {"n": 34, "title": "Scope one integrated capstone and freeze its contracts", "why": "The capstone is a versioned document question-answering service backed by your lakehouse. Reuse your components and resist adding an unrelated platform.", "res": "design"}, {"n": 35, "title": "Integrate the capstone data plane", "why": "This week connects existing storage components under the frozen contracts. Every new feature must protect a defined invariant or solve a demonstrated integration gap.", "res": "arrow"}, {"n": 36, "title": "Integrate the model and evaluation plane", "why": "Your generator may remain small; the engineering evidence should be strong. Make model quality limitations visible rather than compensating with unsupported claims.", "res": "torch"}, {"n": 37, "title": "Integrate the serving plane", "why": "The API must preserve version identity and bounded resource use under real requests. Integration checks now matter more than adding framework features.", "res": "fast"}, {"n": 38, "title": "Make deployment and rollback repeatable", "why": "A deployment is only useful if another engineer can reproduce it and recover from a bad release. Use a real cloud test only when access and budget are available.", "res": "docker"}, {"n": 39, "title": "Challenge the integrated system with failures", "why": "The final engineering test is behavior under stress and interruption. Keep the workload bounded and document both guarantees and unresolved limitations.", "res": "design"}, {"n": 40, "title": "Demonstrate independent engineering within the chosen scope", "why": "The finish line is a defensible system and the ability to explain its limits. Advanced specialization continues after this evidence-based assessment.", "res": "design"}], "phases": [{"name": "Foundations that connect", "weeks": "1–8", "hours": 168, "gate": "Derive and check a regression gradient; explain p function renderGuide(){$('content').innerHTML=`<div class="hero"><div class="eyebrow">Your engineering apprenticeship</div><h1>Build the mechanism.<br>Explain the system.</h1><p>The north star is an engineer who can connect data, model behavior, execution, and reliability—and defend the tradeoffs with working evidence.</p></div><section class="card"><h2>Why 280 days</h2><p>This is a planning estimate, not a research-derived guarantee: <b>240 focused build/study sessions × 3h = 720h</b>, plus <b>40 review/repair sessions × 3h = 120h</b>. Total: <b>840 hours</b>. The scope includes simplified internal components and one integrated system, not production-grade replacements for a DBMS, consensus library, or LLM engine.</p><p>At seven sessions per week this is 40 weeks, from ${planned(1)} to ${planned(280)}. At six sessions per week, allow roughly 47 calendar weeks. Review days contain repair time. Substantial prerequisite gaps or missed sessions extend the end date; never compensate with a six-hour day.</p><p>The 3-hour cap overrides the example allocations in your source prompt, some of which sum to more than three hours. Every day here totals exactly 180 minutes.</p><div class="notice">Target: Level 3 systems reasoning across the covered areas, with Level 4 independent engineering in the bounded capstone. Level 5 specialization takes further sustained work. This is not a promise of expertise or a job.</div></section><section class="card"><h2>Current-level assessment</h2><div class="grid2"><div><h3>Useful starting strengths</h3><p>Your stated Python/C, backend, data-format, SQL, and OSS exposure means we can start with runnable experiments rather than weeks of syntax lessons. Local Lakehouse and Blaze give the work continuity.</p></div><div><h3>Unverified capabilities</h3><p>Exposure does not establish mastery of gradients, recovery, concurrency, experimental controls, or deployment. Day 1 is a diagnostic; each phase ends with an explanation, implementation, and debugging gate.</p></div></div><p><b>Highest leverage:</b> mathematical shape/gradient reasoning, explicit storage invariants, reproducible evaluation, and failure-driven systems design. These connect your fragmented knowledge.</p><p><b>Difficulty rule:</b> demonstrate a known capability with a short explanation and passing test. Spend the rest of that session on an edge case, benchmark, or repair; do not add another technology. If you cannot finish within 180 minutes, keep the day open.</p></section><section class="card"><h2>Master skill map & prerequisite graph</h2><p>Read each row as a dependency path. Parallel paths meet at the capstone; there is no need to finish all mathematics before touching files.</p><div class="table-wrap"><table><thead><tr><th>Path</th><th>Prerequisites → capabilities</th><th>Evidence</th></tr></thead><tbody>${rows([
['Mathematics → ML','Shapes and geometry → derivatives and probability → optimization → estimation and evaluation','NumPy regression, finite differences, likelihood, PCA'],
['ML → DL → LLMs','Evaluation and gradients → MLP/backprop → PyTorch → attention → decoder → KV caching','Gradient checks, causal invariants, tiny model, cache-equivalent logits'],

['Backend → distributed systems','HTTP/schema → service lifecycle → async/processes → queues/idempotency → replication/consensus → conditional cloud commits','Bounded API, retry simulation, conflict tests, deployment evidence'],
['AI data → retrieval → serving','Versioned Parquet → embeddings/exact search → indexed search → retrieval evaluation → evidence-based answers','Snapshot-pinned index, gold queries, citations and abstention'],
['Cross-cutting','JSON Schema + Blaze source reading + tests + benchmarks + one-page explanations','Verified code traces, local regression candidates, honest OSS status'],
['Cloud + operations','Identity/network boundaries → objects/compute → observability → rollback/restore → failure drills','Access matrix, release runbook, restore and incident evidence'],
['Maintenance only','DSA outside this 3-hour block if energy allows; networking introduced at API/deployment boundaries','No compulsory extra study hours']
])}</tbody></table></div></section><section class="card"><h2>Five phases, five demonstrations</h2>${C.phases.map((p,i)=>`<div class="resource"><span class="badge">Phase ${i+1} · Weeks ${p.weeks} · ${p.hours} hours</span><h3 style="margin-top:10px">${esc(p.name)}</h3><p>${esc(p.gate)}</p><button data-open-phase="${i}">View phase days →</button></div>`).join('')}</section><section class="card"><h2>Three connected project homes</h2><div class="table-wrap"><table><thead><tr><th>Home</th><th>Progression</th><th>Scope boundary</th></tr></thead><tbody>${rows([
['Mechanism laboratory','Weeks 2–9: NumPy, pages, buffers, B+ tree, logs. Weeks 13–18: network, attention, cache. Weeks 25–26: replication simulations.','Small educational components; not a custom production storage engine.'],
['Local Lakehouse','W1 typed ingest/query → W8 experiment provenance → W9–12 snapshots, commit/recovery, schema/compaction → W28 conditional object-store protocol → W35 capstone data plane.','Keep custom pages/B+ trees in the lab. Parquet owns file internals; DuckDB owns query execution.'],
['AI service / integrated capstone','W17 tiny model → W19 API → W20–22 retrieval and RAG evaluation → W23–32 bounded jobs, distribution, operation → W33–40 versioned document-answering system.','One evolving service. No mandatory frontend, giant training job, or framework collection.']
])}</tbody></table></div><p>Use public or synthetic documents and a small CPU-friendly workload by default. Hardware was not specified. Local simulators and the trained tiny model keep the program executable; cloud/GPU results must be labeled unverified when not run. The final capability report should preserve those limitations.</p></section><section class="card"><h2>OSS and research without losing the main thread</h2><p>Every weekly review includes 20 minutes for an existing issue, contribution note, or follow-up. Dedicated source/contribution days occur in weeks 1, 4, 8, 11, 15, 20, 23, 27, 30, and 37. Progress from source trace → spec mapping → reproduction → local test → scoped contribution → review response. Acceptance depends on maintainers and is never a graduation requirement.</p><p>For <i>De-Assembling Blaze’s Engine</i>, accumulate verified notes on parsing/walking, reference resolution, keyword compilation, instruction generation, runtime execution, and measurements. Pin the commit and cite actual symbols. Do not claim a defect or invent an issue from a vague suspicion.</p><p>Three paper anchors: attention after gradients, PagedAttention after a working KV cache, and Raft after replication failure experiments. Each paper’s resource card states prerequisites, reading scope, an experiment, and the one-page summary goal.</p></section><section class="card"><h2>Writing that compounds</h2><p>Each day has a specific heading and a 25–30 minute page block. A diagram plus 200 thoughtful words is more useful than padding. Daily notes are working evidence, not 280 polished public articles.</p><div class="table-wrap"><table><thead><tr><th>Series</th><th>Source material</th><th>Final synthesis</th></tr></thead><tbody>${rows([
['Mathematics for ML / ML-DL','Weeks 2, 4, 6–8, 13–17','Shapes → loss → gradients → trained models'],

])}</tbody></table></div><p>Week 40 edits the notes into three substantial articles. Other series can remain organized notes until you have stronger evidence.</p></section><section class="card"><h2>How to assess competence</h2><div class="table-wrap"><table><thead><tr><th>Level</th><th>Observable capability</th></tr></thead><tbody>${rows([
['1 · Foundational understanding','Explain the mechanism and its assumptions without copying a definition.'],['2 · Implementation competence','Build a bounded version and demonstrate meaningful tests.'],['3 · Systems reasoning','Predict interactions, failure modes, resource costs, and tradeoffs.'],['4 · Independent engineering','Scope, implement, debug, evaluate, and document a complete bounded system.'],['5 · Advanced specialization','Develop deep judgment in a chosen domain through sustained real workloads and research; beyond this core plan.']
])}</tbody></table></div><p>At each phase checkpoint, write <b>demonstrated / needs repair / not attempted</b> for theory, implementation, systems reasoning, AI knowledge, project quality, OSS evidence, and writing. Attach a concrete example. Do not convert these judgments into mastery percentages.</p></section><section class="card"><h2>Definition of done</h2><ul><li>Derive and numerically check a simple model gradient; explain masks, training loss, decoding, and KV state.</li><li>Implement and test the local snapshot protocol, immutable file lists, compatibility rules, and recovery boundaries.</li><li>Connect an identified dataset to an identified retrieval index, model, evaluation, and served answer.</li><li>Demonstrate bounded concurrency, idempotent jobs, conditional-write conflicts, authorization, rollback, and restore.</li><li>Reproduce results from a clean environment and diagnose an injected failure using logs and tests.</li><li>Defend architectural alternatives, report benchmark conditions and known limits, and present actual OSS/writing evidence.</li></ul><p>If cloud deployment was not performed, record “local deployment demonstrated; provider deployment pending.” If final gates fail, the program is not complete merely because every checkbox is ticked: reopen the relevant day and schedule a bounded repair.</p></section>`;$('content').querySelectorAll('[data-open-phase]').forEach(b=>b.onclick=()=>{filterPhase=b.dataset.openPhase;view='roadmap';render()})}
function renderResources(){$('content').innerHTML=`<div class="hero"><div class="eyebrow">Primary sources, limited scope</div><h1>No resource hunting.</h1><p>Daily cards select one primary resource and at most one supplement. These links were checked on 21 September 2026, except the DuckDB page whose redirect is flagged. Chapter numbers are supplied only where verified.</p></div><div class="notice">Your DBMS and system-design titles/editions were not supplied. Their exact chapter mapping remains open. Enter them under Progress & backups; the daily topics and supplementary references are already available. Generic documentation entry points do not imply every custom experiment has an official tutorial.</div><section class="card">${Object.keys(C.resources).map(k=>rlink(k)).join('')}</section>`}
function download(text,name,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportProgress(){save();download(JSON.stringify(state,null,2),'ai-systems-progress-'+new Date().toISOString().slice(0,10)+'.json','application/json');notify('Progress backup downloaded.')}
function portable(){save();const copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-progress').textContent=JSON.stringify(state).replace(/</g,'\\u003c');copy.querySelector('#toast').classList.add('hidden');download('<!doctype html>\n'+copy.outerHTML,'ai-systems-daily-planner-with-progress.html','text/html');notify('Portable planner downloaded with your current progress.')}
function renderSettings(){const count=Object.values(state.days).filter(x=>x.done).length;$('content').innerHTML=`<div class="hero"><div class="eyebrow">Make progress portable</div><h1>Your work, kept together.</h1><p>${count} days closed. The planner saves checks, notes, and evidence paths in this browser. It does not automatically sync across devices or write changes back into the original downloaded file.</p></div><section class="card"><h2>Back up and restore</h2><p>For reliable use, download the HTML and open it in a regular browser. File previews may restrict scripts or saving. Keep using the same browser and file location. Browser cleanup or moving the file can affect saved progress.</p><div class="row"><button id="export-json" class="primary">Export progress (.json)</button><button id="import-json">Import progress</button><button id="portable">Download planner with progress</button></div><div class="notice">Export at least weekly. The portable HTML includes your current notes and checklist state, so you can reopen it elsewhere. Import restores a chosen backup after confirmation; it replaces the current progress. Nothing is uploaded by this page.</div><p id="storage-message">${storageOK?'Browser saving is currently available.':'Browser saving is unavailable. Use an export before closing.'}</p></section><section class="card"><h2>Schedule</h2><p>The original Day 1 is 21 September 2026. Dates label the intended sequence; unfinished days remain open. Changing this anchor relabels all planned dates and preserves your completion history.</p><label class="field" for="start-date">Day 1 date</label><input type="date" id="start-date" value="${state.start}" min="2020-01-01" max="2100-12-31" style="max-width:240px"><p style="margin-top:12px">Current planned end: ${planned(280)}</p><button id="calendar-today">Open today’s calendar slot</button><small style="display:block;margin-top:8px">This previews the scheduled slot; it does not complete or skip earlier work.</small></section><section class="card"><h2>Your existing resources</h2><label class="field" for="db-book">DBMS book · title, edition, and your chapter notes</label><input type="text" id="db-book" value="${esc(state.books.db)}" placeholder="Title not yet provided"><label class="field" for="design-book">System-design book · title, edition, and your chapter notes</label><input type="text" id="design-book" value="${esc(state.books.design)}" placeholder="Title not yet provided"><p style="margin-top:12px"><small>Saving a title labels the primary resource. It does not automatically verify or invent chapter numbers.</small></p></section><section class="card"><h2>Daily workflow</h2><ol><li>Open Continue learning.</li><li>Read the objective and use the assigned 180-minute budget.</li><li>Build in your own repository; tick checks only after doing the work.</li><li>Record evidence and a short note, then choose Close day & continue.</li><li>If blocked, leave it open. Use the next session to finish it.</li><li>Export progress at each weekly review.</li></ol><p>The planner has no server, tracking, AI calls, or paid dependency. Resource links open separately and need internet access. The checklist and curriculum work offline.</p></section>`;$('export-json').onclick=exportProgress;$('import-json').onclick=()=>$('import-file').click();$('portable').onclick=portable;$('start-date').onchange=e=>{if(e.target.value&&e.target.checkValidity()){state.start=e.target.value;save();renderSettings();notify('Planned dates updated; completion history preserved.')}};$('db-book').oninput=e=>{state.books.db=e.target.value;save()};$('design-book').oninput=e=>{state.books.design=e.target.value;save()};$('calendar-today').onclick=()=>{const now=new Date();const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());const begin=Date.parse(state.start+'T00:00:00Z');showDay(Math.floor((today-begin)/86400000)+1)}}
$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('Backup is too large.');const s=JSON.parse(await f.text());if(!valid(s))throw Error('This is not a valid backup for this 280-day planner.');if(confirm('Replace current checks, notes, dates, and book labels with this backup? Export current progress first if you want to keep it.')){state=s;save();view='day';state.selected=next();render();notify('Progress restored.')}}catch(err){notify('Import failed: '+err.message)}finally{e.target.value=''}};
function render(){overview();document.querySelectorAll('nav [data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});({day:renderDay,roadmap:renderRoadmap,guide:renderGuide,resources:renderResources,settings:renderSettings})[view]()}
document.querySelectorAll('nav [data-view]').forEach(b=>b.onclick=()=>{setView(b.dataset.view);window.scrollTo({top:0})});$('resume').onclick=()=>showDay(next());$('current-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});state.selected=next();render();
</script></body></html>
